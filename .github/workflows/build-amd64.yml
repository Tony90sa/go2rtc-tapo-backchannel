name: Build patched go2rtc AMD64 for Tapo backchannel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout go2rtc
        uses: actions/checkout@v4
        with:
          repository: AlexxIT/go2rtc
          ref: master

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Apply Tapo patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pkg/tapo/producer.go")
          lines = p.read_text().splitlines()
          out = []
          i = 0
          patched = False

          while i < len(lines):
              if (
                  i + 2 < len(lines)
                  and lines[i].strip() == "if err := c.SetupStream(); err != nil {"
                  and lines[i + 1].strip() == "return nil, err"
                  and lines[i + 2].strip() == "}"
              ):
                  out.extend([
                      "\t// Tapo has one audio session. Do not start the proprietary preview stream here.",
                      "\t// RTSP owns video/audio while SetupBackchannel() handles PC-to-camera audio."
                  ])
                  i += 3
                  patched = True
                  continue
              out.append(lines[i])
              i += 1

          if not patched:
              raise SystemExit("ERROR: SetupStream block not found in current go2rtc master")

          p.write_text("\n".join(out) + "\n")
          PY

      - name: Verify patch
        run: grep -A2 -B2 "Tapo has one audio session" pkg/tapo/producer.go

      - name: Build AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -trimpath -o go2rtc

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-linux-amd64-tapo-backchannel
          path: go2rtc
